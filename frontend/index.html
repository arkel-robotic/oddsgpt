<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#07090e"/>
<title>OddsGPT — AI Betting Analyst</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090e;--s:#0c1018;--p:#101520;--p2:#141a24;
  --b:#1c2535;--b2:#243040;
  --a:#f0c040;--a2:#e05c20;--a3:#30d080;--blue:#3080ff;
  --t:#dde4f0;--m:#4a5a70;--m2:#6a7a90;
  --win:#30d080;--lose:#f05050;--warn:#f0c040;
  --safe:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--t);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

/* ═══ AUTH ════════════════════════════════════════════════════════ */
.auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.auth-box{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;text-align:center;margin-bottom:4px}
.auth-logo .g{color:var(--a)} .auth-logo .w{color:var(--t)}
.auth-tag{text-align:center;font-size:10px;color:var(--m);font-family:'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.tabs2{display:flex;background:var(--p);border-radius:8px;padding:3px;gap:3px;margin-bottom:20px}
.tab2{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px;transition:all .2s;color:var(--m);background:none;border:none;font-family:'Outfit',sans-serif}
.tab2.on{background:var(--a);color:#000}
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;color:var(--m);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.field input{width:100%;background:var(--p);border:1px solid var(--b);border-radius:8px;padding:12px 14px;color:var(--t);font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:rgba(240,192,64,.4)}
.abtn{width:100%;background:var(--a);border:none;border-radius:8px;color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;padding:13px;cursor:pointer;transition:all .2s;margin-top:4px}
.abtn:hover{background:#ffd060} .abtn:active{transform:scale(.97)}
.alink{text-align:center;margin-top:12px;font-size:12px;color:var(--m)}
.alink a{color:var(--a);cursor:pointer}
.aerr{background:rgba(240,80,80,.1);border:1px solid rgba(240,80,80,.2);border-radius:6px;padding:9px 12px;font-size:12px;color:var(--lose);margin-top:8px;display:none}
.aok{background:rgba(48,208,128,.1);border:1px solid rgba(48,208,128,.2);border-radius:6px;padding:9px 12px;font-size:12px;color:var(--win);margin-top:8px;display:none}

/* ═══ MODAL ═══════════════════════════════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:900;padding:16px}
.overlay.show{display:flex}
.mbox{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:24px 22px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.mtitle{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;color:var(--a);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.xbtn{background:none;border:none;color:var(--m);font-size:20px;cursor:pointer;line-height:1}

/* ═══ APP LAYOUT ══════════════════════════════════════════════════ */
.app{display:none;height:100vh;height:100dvh}
.app.on{display:grid;grid-template-columns:240px 1fr}

/* ═══ SIDEBAR (desktop) ════════════════════════════════════════════ */
.sidebar{background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow:hidden;height:100vh}
.sb-logo{padding:16px 14px 12px;border-bottom:1px solid var(--b)}
.sb-logo .name{font-family:'Syne',sans-serif;font-weight:800;font-size:22px}
.sb-logo .name .g{color:var(--a)} .sb-logo .name .w{color:var(--t)}
.sb-user{font-size:11px;color:var(--m);margin-top:4px;display:flex;align-items:center;gap:6px}
.role-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;font-weight:600}
.role-free{background:rgba(74,90,112,.2);color:var(--m);border:1px solid rgba(74,90,112,.3)}
.role-premium{background:rgba(240,192,64,.15);color:var(--a);border:1px solid rgba(240,192,64,.3)}
.role-operator{background:rgba(48,128,255,.15);color:var(--blue);border:1px solid rgba(48,128,255,.3)}
.role-admin{background:rgba(224,92,32,.15);color:var(--a2);border:1px solid rgba(224,92,32,.3)}
.new-btn{margin:10px 10px 0;background:var(--a);border:none;border-radius:8px;color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:10px;cursor:pointer;width:calc(100% - 20px);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.new-btn:hover{background:#ffd060}
.sb-sec{padding:8px 14px 4px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:2px}
.hist{flex:1;overflow-y:auto;padding:0 8px}
.hist::-webkit-scrollbar{width:3px} .hist::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.hi{padding:8px 10px;border-radius:7px;cursor:pointer;margin-bottom:2px;transition:background .15s;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--m2)}
.hi:hover,.hi:active{background:var(--p);color:var(--t)}
.hi.on{background:var(--p2);color:var(--t)}
.hi-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi-x{opacity:0;background:none;border:none;color:var(--m);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:3px;flex-shrink:0;transition:all .15s}
.hi:hover .hi-x{opacity:1} .hi-x:hover{color:var(--lose)}
.sb-bot{padding:10px 14px;border-top:1px solid var(--b);flex-shrink:0}
.live-dot{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--a3);margin-bottom:4px}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--a3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.disc{font-size:9px;color:var(--m);line-height:1.5}
.sb-nav{padding:8px}
.sbnav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--m2);background:none;border:none;font-family:'Outfit',sans-serif;transition:background .15s}
.sbnav-btn:hover{background:var(--p);color:var(--t)}
.sbnav-btn.on{background:var(--p2);color:var(--a)}

/* ═══ MAIN AREA ═══════════════════════════════════════════════════ */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Topbar (mobile) */
.topbar{display:none;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--s);border-bottom:1px solid var(--b);flex-shrink:0}
.tb-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}
.tb-logo .g{color:var(--a)} .tb-logo .w{color:var(--t)}
.tb-right{display:flex;gap:7px;align-items:center}
.icon-btn{background:var(--p);border:1px solid var(--b);border-radius:8px;color:var(--t);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .2s;flex-shrink:0}
.icon-btn:hover{border-color:var(--a)}

/* Sport tabs */
.tabs-bar{border-bottom:1px solid var(--b);background:var(--s);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.tabs-bar::-webkit-scrollbar{height:0}
.tabs-inner{display:flex;padding:0 10px;min-width:max-content}
.stab{padding:11px 13px;font-size:11px;font-weight:600;color:var(--m);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:4px;background:none;border-top:none;border-left:none;border-right:none;font-family:'Outfit',sans-serif}
.stab:hover{color:var(--t)}
.stab.on{color:var(--a);border-bottom-color:var(--a)}

/* Panels */
.panel{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel.on{display:flex;flex-direction:column}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:16px 18px 8px;-webkit-overflow-scrolling:touch}
.msgs::-webkit-scrollbar{width:4px} .msgs::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 12px;animation:fi .5s}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.wb{display:inline-flex;align-items:center;gap:6px;background:rgba(240,192,64,.08);border:1px solid rgba(240,192,64,.2);border-radius:20px;padding:5px 13px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--a);margin-bottom:14px;letter-spacing:1px}
.welcome h1{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;color:var(--t);margin-bottom:8px}
.welcome h1 .g{color:var(--a)}
.welcome p{color:var(--m2);font-size:13px;max-width:380px;line-height:1.7;margin-bottom:20px}
.hot-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;text-align:left;width:100%;max-width:560px}
.hot-games{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%;max-width:560px}
.hg{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:10px 13px;cursor:pointer;transition:all .2s;text-align:left;flex:1;min-width:140px;max-width:200px}
.hg:hover,.hg:active{border-color:var(--a);background:rgba(240,192,64,.04);transform:translateY(-2px)}
.hg-sp{font-size:9px;color:var(--a2);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.hg-m{font-size:12px;font-weight:600;color:var(--t);line-height:1.3}
.hg-d{font-size:10px;color:var(--m);margin-top:2px}
.load-txt{color:var(--m);font-size:12px;font-family:'JetBrains Mono',monospace}

/* Message bubbles */
.msg{display:flex;gap:10px;margin-bottom:16px;animation:fu .3s}
.msg-u{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.av-u{background:linear-gradient(135deg,#1a2a4a,#0d1828);border:1px solid #1e3a5a;color:var(--blue);font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700}
.av-a{background:linear-gradient(135deg,#1a1400,#0d0a00);border:1px solid #3a2a00}
.mb{max-width:84%}
.msg-u .mb{align-items:flex-end;display:flex;flex-direction:column}
.mn{font-size:9px;color:var(--m);font-family:'JetBrains Mono',monospace;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.msg-u .mn{text-align:right}
.bbl{padding:11px 14px;border-radius:11px;font-size:13px;line-height:1.75;word-break:break-word}
.bbl-u{background:var(--p2);border:1px solid var(--b2);border-bottom-right-radius:3px}
.bbl-a{background:var(--p);border:1px solid var(--b);border-bottom-left-radius:3px}
.bbl strong{color:var(--a);font-family:'Syne',sans-serif}
.bbl em{color:var(--warn);font-style:normal}
.bbl code{background:rgba(255,255,255,.05);border:1px solid var(--b2);border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:11px}
.bbl ul{padding-left:14px;margin:4px 0} .bbl li{margin:2px 0;font-size:12px}

/* Conclusion */
.conc{background:linear-gradient(135deg,rgba(240,192,64,.07),rgba(240,192,64,.02));border:1px solid rgba(240,192,64,.25);border-radius:10px;padding:12px 14px;margin-top:10px}
.conc-lbl{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--a);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.conc-txt{font-size:13px;color:var(--t);line-height:1.7}

/* Bet cards */
.bets-wrap{margin-top:10px}
.bets-lbl{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--a);margin-bottom:7px}
.bc{background:var(--s);border:1px solid var(--b);border-radius:9px;padding:11px 13px;margin-bottom:7px;display:grid;grid-template-columns:1fr auto;gap:4px;position:relative;overflow:hidden}
.bc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.bc.Low::before{background:var(--win)} .bc.Medium::before{background:var(--warn)} .bc.High::before{background:var(--lose)}
.bc-match{font-size:9px;color:var(--m);font-family:'JetBrains Mono',monospace;text-transform:uppercase;grid-column:1/-1;margin-bottom:2px}
.bc-type{font-size:9px;color:var(--m2);font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.bc-pick{font-size:14px;font-weight:700;color:var(--t);margin:2px 0;font-family:'Syne',sans-serif}
.bc-reason{font-size:11px;color:var(--m2);line-height:1.5}
.bc-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bc-odds{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--a2)}
.rb{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:8px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.Low.rb{background:rgba(48,208,128,.1);color:var(--win);border:1px solid rgba(48,208,128,.2)}
.Medium.rb{background:rgba(240,192,64,.1);color:var(--warn);border:1px solid rgba(240,192,64,.2)}
.High.rb{background:rgba(240,80,80,.1);color:var(--lose);border:1px solid rgba(240,80,80,.2)}
.cbar{height:2px;background:rgba(255,255,255,.05);border-radius:1px;margin-top:8px;grid-column:1/-1;overflow:hidden}
.cfill{height:100%;border-radius:1px;transition:width 1.2s}
.Low .cfill{background:var(--win)} .Medium .cfill{background:var(--warn)} .High .cfill{background:var(--lose)}
.clbl{font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--m);text-align:right;grid-column:1/-1;margin-top:2px}
.res-btns{display:flex;gap:4px;margin-top:6px;grid-column:1/-1}
.rbtn{font-size:9px;padding:3px 8px;border-radius:4px;border:1px solid var(--b);background:var(--p2);color:var(--m);cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s}
.rbtn:hover{color:var(--t)} .rbtn.wb:hover{background:rgba(48,208,128,.1);border-color:var(--win);color:var(--win)} .rbtn.lb:hover{background:rgba(240,80,80,.1);border-color:var(--lose);color:var(--lose)}

/* Parlay */
.parlay{background:rgba(240,192,64,.05);border:1px solid rgba(240,192,64,.2);border-radius:9px;padding:11px 13px;margin-top:7px}
.parlay-ttl{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--a);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
.parlay-picks{font-size:12px;color:var(--m2);line-height:1.7}
.parlay-odds{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--a2);margin-top:4px}

/* Limit card */
.lcard{background:rgba(240,80,80,.05);border:1px solid rgba(240,80,80,.2);border-radius:10px;padding:16px;text-align:center}
.lcard-t{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--lose);margin-bottom:8px}
.code-row{display:flex;gap:6px;margin-top:12px}
.code-inp{flex:1;background:var(--p);border:1px solid var(--b);border-radius:7px;padding:9px 11px;color:var(--t);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;-webkit-appearance:none}
.code-inp:focus{border-color:var(--a)}
.code-btn{background:var(--a);border:none;border-radius:7px;color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;padding:9px 14px;cursor:pointer;white-space:nowrap}

/* Typing */
.typing{display:flex;gap:10px;margin-bottom:16px}
.dots{display:flex;gap:4px;align-items:center;background:var(--p);border:1px solid var(--b);padding:12px 14px;border-radius:11px;border-bottom-left-radius:3px}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--m);animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

/* Input area */
.input-area{padding:10px 14px calc(10px + var(--safe));border-top:1px solid var(--b);background:var(--s);flex-shrink:0}
.hint{font-size:10px;color:var(--m);font-family:'JetBrains Mono',monospace;margin-bottom:7px}
.hint span{color:var(--a2)}
.irow{display:flex;gap:7px;align-items:flex-end}
.tinput{flex:1;background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px 13px;color:var(--t);font-family:'Outfit',sans-serif;font-size:14px;resize:none;min-height:44px;max-height:120px;line-height:1.5;outline:none;transition:border-color .2s;-webkit-appearance:none}
.tinput::placeholder{color:var(--m)}
.tinput:focus{border-color:rgba(240,192,64,.35)}
.sbtn{width:44px;height:44px;border-radius:10px;background:var(--a);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.sbtn:hover{background:#ffd060} .sbtn:active{transform:scale(.92)} .sbtn:disabled{opacity:.3;cursor:not-allowed}
.sbtn svg{width:17px;height:17px;fill:#000}

/* Secondary panels */
.sec-panel{padding:16px 18px;overflow-y:auto;flex:1}
.pt{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--t);margin-bottom:14px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.sbox{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:12px;text-align:center}
.snum{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--a)}
.slbl{font-size:10px;color:var(--m);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.bet-hi{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:11px 13px;margin-bottom:7px;position:relative;overflow:hidden}
.bhr{position:absolute;right:10px;top:10px;font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.bhr.won{background:rgba(48,208,128,.1);color:var(--win)} .bhr.lost{background:rgba(240,80,80,.1);color:var(--lose)} .bhr.pending{background:rgba(240,192,64,.1);color:var(--warn)}
.bhi-m{font-size:10px;color:var(--m);font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.bhi-p{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--t)}
.bhi-c{font-size:11px;color:var(--m2);margin-top:3px}
.bhi-acts{display:flex;gap:5px;margin-top:8px}
.bhi-btn{font-size:10px;padding:3px 9px;border-radius:5px;border:1px solid var(--b);background:var(--p2);color:var(--m);cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s}
.bhi-btn:hover{color:var(--t)}
.sec-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:2px;margin:14px 0 8px}
.prof-card{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:16px;margin-bottom:12px}
.prof-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--t)}
.prof-email{font-size:12px;color:var(--m);margin-top:3px}
.prof-badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ubar-wrap{margin-top:10px} .ubar{background:rgba(255,255,255,.05);border-radius:4px;height:6px;overflow:hidden} .ufill{height:100%;background:var(--a);border-radius:4px;transition:width .5s} .utxt{font-size:10px;color:var(--m);font-family:'JetBrains Mono',monospace;margin-top:4px}
.act-btn{width:100%;background:var(--p);border:1px solid var(--b);border-radius:8px;color:var(--t);font-family:'Outfit',sans-serif;font-size:13px;padding:11px 14px;cursor:pointer;margin-bottom:7px;transition:all .2s;text-align:left;display:flex;align-items:center;gap:10px}
.act-btn:hover{border-color:var(--a);color:var(--a)}
.danger-btn{width:100%;background:rgba(240,80,80,.08);border:1px solid rgba(240,80,80,.2);border-radius:8px;color:var(--lose);font-family:'Outfit',sans-serif;font-size:13px;padding:11px;cursor:pointer;margin-top:6px;transition:all .2s}
.danger-btn:hover{background:rgba(240,80,80,.15)}
.admin-table{width:100%;border-collapse:collapse;font-size:11px}
.admin-table th{text-align:left;padding:7px 8px;color:var(--m);font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--b)}
.admin-table td{padding:7px 8px;border-bottom:1px solid rgba(28,37,53,.5);color:var(--t)}
.admin-table tr:hover td{background:var(--p)}
.tbtn{background:var(--p2);border:1px solid var(--b);border-radius:5px;color:var(--a);font-size:10px;padding:2px 7px;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace}
.tbtn:hover{border-color:var(--a)} .tbtn.red{color:var(--lose)} .tbtn.red:hover{border-color:var(--lose)}
.promo-sec{padding-top:14px;border-top:1px solid var(--b);margin-top:14px}

/* Bottom nav (mobile) */
.bnav{display:none;border-top:1px solid var(--b);background:var(--s);flex-shrink:0;padding-bottom:var(--safe)}
.bnav-inner{display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;transition:color .2s;color:var(--m);background:none;border:none;gap:3px;font-family:'Outfit',sans-serif}
.nb.on{color:var(--a)}
.nb-icon{font-size:18px;line-height:1}
.nb-lbl{font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

/* ═══ RESPONSIVE ══════════════════════════════════════════════════ */
@media(max-width:767px){
  .app.on{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{display:flex}
  .tabs-bar{display:none}
  .bnav{display:block}
}
@media(min-width:768px){
  .topbar{display:none}
  .bnav{display:none}
}
@media(min-width:768px) and (max-width:1023px){
  .app.on{grid-template-columns:200px 1fr}
}
@media(min-width:1200px){
  .app.on{grid-template-columns:260px 1fr}
  .msgs{padding:20px 24px 12px}
  .input-area{padding:12px 24px calc(12px + var(--safe))}
  .bbl{font-size:14px}
}
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth" id="auth">
  <div class="auth-box">
    <div class="auth-logo"><span class="g">Odds</span><span class="w">GPT</span></div>
    <div class="auth-tag">AI Betting Analyst</div>
    <div class="tabs2">
      <button class="tab2 on" onclick="sAuth('login')">Login</button>
      <button class="tab2"    onclick="sAuth('reg')">Register</button>
    </div>
    <div id="loginF">
      <div class="field"><label>Username</label><input id="lUser" type="text" placeholder="username" autocomplete="username"/></div>
      <div class="field"><label>Password</label><input id="lPass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="abtn" onclick="doLogin()">Login</button>
      <div class="alink"><a onclick="showForgot()">Forgot password?</a></div>
    </div>
    <div id="regF" style="display:none">
      <div class="field"><label>Username</label><input id="rUser" type="text" placeholder="choose a username" autocomplete="username"/></div>
      <div class="field"><label>Email</label><input id="rEmail" type="email" placeholder="your@email.com" autocomplete="email"/></div>
      <div class="field"><label>Password</label><input id="rPass" type="password" placeholder="min 6 chars (or operator code)" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReg()"/></div>
      <button class="abtn" onclick="doReg()">Create Account</button>
    </div>
    <div class="aerr" id="aErr"></div>
    <div class="aok"  id="aOk"></div>
  </div>
</div>

<!-- FORGOT MODAL -->
<div class="overlay" id="forgotOv">
  <div class="mbox">
    <div class="mtitle">Reset Password <button class="xbtn" onclick="closeForgot()">✕</button></div>
    <div class="field"><label>Email</label><input id="fEmail" type="email" placeholder="your@email.com"/></div>
    <button class="abtn" onclick="doForgot()">Send Reset Link</button>
    <div class="aerr" id="fErr"></div>
    <div class="aok"  id="fOk"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <!-- SIDEBAR (desktop) -->
  <div class="sidebar">
    <div class="sb-logo">
      <div class="name"><span class="g">Odds</span><span class="w">GPT</span></div>
      <div class="sb-user"><span id="sbUname">User</span><span id="sbRole" class="role-badge role-free">Free</span></div>
    </div>
    <div style="padding:8px 10px 0">
      <button class="new-btn" onclick="newChat();gotoChat()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Analysis
      </button>
    </div>
    <div class="sb-nav">
      <button class="sbnav-btn on" id="sn-chat"   onclick="gotoChat()">💬 Chat</button>
      <button class="sbnav-btn"    id="sn-dash"   onclick="gotoPanel('dash')">📊 My Stats</button>
      <button class="sbnav-btn"    id="sn-prof"   onclick="gotoPanel('prof')">👤 Profile</button>
      <button class="sbnav-btn"    id="sn-staff"  onclick="gotoPanel('staff')" style="display:none">🔧 Staff</button>
      <button class="sbnav-btn"    id="sn-admin"  onclick="gotoPanel('admin')" style="display:none">🔐 Admin</button>
    </div>
    <div class="sb-sec">Recent Chats</div>
    <div class="hist" id="sbHist"></div>
    <div class="sb-bot">
      <div class="live-dot"><span class="pulse"></span>Live Internet</div>
      <div class="disc">⚠ For entertainment only. Bet responsibly.</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- Mobile topbar -->
    <div class="topbar">
      <div class="tb-logo"><span class="g">Odds</span><span class="w">GPT</span></div>
      <div class="tb-right">
        <span id="mbBadge" class="role-badge role-free">FREE</span>
        <div class="icon-btn" onclick="gotoPanel('prof')">👤</div>
      </div>
    </div>

    <!-- Sport tabs -->
    <div class="tabs-bar">
      <div class="tabs-inner">
        <button class="stab on" data-sport="all"               onclick="sTab(this)">🎯 All</button>
        <button class="stab"    data-sport="football"          onclick="sTab(this)">⚽ Football</button>
        <button class="stab"    data-sport="basketball"        onclick="sTab(this)">🏀 Basketball</button>
        <button class="stab"    data-sport="tennis"            onclick="sTab(this)">🎾 Tennis</button>
        <button class="stab"    data-sport="hockey"            onclick="sTab(this)">🏒 Hockey</button>
        <button class="stab"    data-sport="baseball"          onclick="sTab(this)">⚾ Baseball</button>
        <button class="stab"    data-sport="american football" onclick="sTab(this)">🏈 NFL</button>
        <button class="stab"    data-sport="ufc"               onclick="sTab(this)">🥊 UFC/MMA</button>
      </div>
    </div>

    <!-- CHAT PANEL -->
    <div class="panel on" id="chatP">
      <div class="msgs" id="msgs"></div>
      <div class="input-area">
        <div class="hint">e.g. <span>football - Arsenal vs Chelsea</span> or paste a list of games</div>
        <div class="irow">
          <textarea id="inp" class="tinput" placeholder="Type a match..." rows="1" onkeydown="hKey(event)" oninput="aResize(this)"></textarea>
          <button class="sbtn" id="sBtn" onclick="sendMsg()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- DASHBOARD PANEL -->
    <div class="panel" id="dashP">
      <div class="sec-panel" id="dashC">Loading...</div>
    </div>

    <!-- PROFILE PANEL -->
    <div class="panel" id="profP">
      <div class="sec-panel" id="profC">Loading...</div>
    </div>

    <!-- STAFF PANEL -->
    <div class="panel" id="staffP">
      <div class="sec-panel" id="staffC">Loading...</div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="panel" id="adminP">
      <div class="sec-panel" id="adminC">Loading...</div>
    </div>

    <!-- Mobile bottom nav -->
    <div class="bnav">
      <div class="bnav-inner">
        <button class="nb on" id="nb-chat"  onclick="gotoChat()"><span class="nb-icon">💬</span><span class="nb-lbl">Chat</span></button>
        <button class="nb"    id="nb-hist"  onclick="showHistMob()"><span class="nb-icon">📋</span><span class="nb-lbl">History</span></button>
        <button class="nb"    id="nb-dash"  onclick="gotoPanel('dash')"><span class="nb-icon">📊</span><span class="nb-lbl">Stats</span></button>
        <button class="nb"    id="nb-prof"  onclick="gotoPanel('prof')"><span class="nb-icon">👤</span><span class="nb-lbl">Profile</span></button>
      </div>
    </div>

  </div>
</div>

<!-- HISTORY MODAL (mobile) -->
<div class="overlay" id="histOv">
  <div class="mbox" style="max-height:80vh">
    <div class="mtitle">📋 Chat History <button class="xbtn" onclick="closeHistMob()">✕</button></div>
    <button style="width:100%;background:var(--a);border:none;border-radius:8px;color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:10px;cursor:pointer;margin-bottom:10px" onclick="newChat();gotoChat();closeHistMob()">+ New Analysis</button>
    <div id="histMobList"></div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────
let tok='',uname='',role='free',sessId=null,sport='all',loading=false,dailyUsed=0;

const ICONS={football:'⚽',basketball:'🏀',tennis:'🎾',hockey:'🏒',baseball:'⚾','american football':'🏈',ufc:'🥊',all:'🎯'};

function load(){tok=localStorage.getItem('og_tok')||'';uname=localStorage.getItem('og_u')||'';role=localStorage.getItem('og_r')||'free';}
function save(){localStorage.setItem('og_tok',tok);localStorage.setItem('og_u',uname);localStorage.setItem('og_r',role);}

// ── INIT ───────────────────────────────────────────────────────────
(async()=>{
  load();
  if(tok){
    try{
      const me=await api('/api/auth/me');
      uname=me.username;role=me.role;dailyUsed=me.daily_used;save();
      await boot();return;
    }catch(e){}
  }
  showAuth();
})();

async function boot(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').classList.add('on');
  updateUI();
  await loadSessions();
  await newChat();
  gotoChat();
}

function showAuth(){
  document.getElementById('auth').style.display='flex';
  document.getElementById('app').classList.remove('on');
}

function updateUI(){
  // Sidebar
  const su=document.getElementById('sbUname'),sr=document.getElementById('sbRole');
  if(su) su.textContent=uname;
  if(sr){sr.textContent=role.charAt(0).toUpperCase()+role.slice(1);sr.className='role-badge role-'+role;}
  // Mobile badge
  const mb=document.getElementById('mbBadge');
  if(mb){mb.textContent=role==='free'?`${Math.max(0,3-dailyUsed)}/3 FREE`:role.toUpperCase();mb.className='role-badge role-'+role;}
  // Staff/admin nav buttons
  ['sn-staff','nb-staff'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display=(role==='operator'||role==='admin')?'':'none';});
  ['sn-admin','nb-admin'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display=role==='admin'?'':'none';});
}

// ── AUTH ───────────────────────────────────────────────────────────
function sAuth(m){
  document.getElementById('loginF').style.display=m==='login'?'':'none';
  document.getElementById('regF').style.display=m==='reg'?'':'none';
  document.querySelectorAll('.tab2').forEach((t,i)=>t.classList.toggle('on',(i===0)===(m==='login')));
  hideAuthMsg();
}
async function doLogin(){
  const u=V('lUser'),p=V('lPass');
  if(!u||!p)return aerr('Fill in all fields');
  try{
    const r=await api('/api/auth/login','POST',{username:u,password:p});
    tok=r.token;uname=r.username;role=r.role;save();
    await boot();
  }catch(e){aerr(e.message);}
}
async function doReg(){
  const u=V('rUser'),e=V('rEmail'),p=V('rPass');
  if(!u||!e||!p)return aerr('Fill in all fields');
  try{
    const r=await api('/api/auth/register','POST',{username:u,email:e,password:p});
    tok=r.token;uname=r.username;role=r.role;save();
    await boot();
  }catch(e){aerr(e.message);}
}
function showForgot(){document.getElementById('forgotOv').classList.add('show');}
function closeForgot(){document.getElementById('forgotOv').classList.remove('show');}
async function doForgot(){
  const e=V('fEmail');
  if(!e)return;
  try{
    await api('/api/auth/forgot','POST',{email:e});
    aok2('fOk','Reset link sent if that email exists.');
  }catch(e){aerr2('fErr',e.message);}
}
function logout(){localStorage.clear();tok='';uname='';role='free';showAuth();}
function aerr(m){const e=document.getElementById('aErr');e.textContent=m;e.style.display='block';}
function aok(m){const e=document.getElementById('aOk');e.textContent=m;e.style.display='block';}
function aerr2(id,m){const e=document.getElementById(id);e.textContent=m;e.style.display='block';}
function aok2(id,m){const e=document.getElementById(id);e.textContent=m;e.style.display='block';}
function hideAuthMsg(){['aErr','aOk','fErr','fOk'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});}

// ── PANELS / NAVIGATION ────────────────────────────────────────────
function gotoChat(){
  setPanel('chatP');
  setNavOn('chat');
  setSbNav('chat');
}

function gotoPanel(name){
  const map={dash:'dashP',prof:'profP',staff:'staffP',admin:'adminP'};
  setPanel(map[name]||'chatP');
  setNavOn(name);
  setSbNav(name);
  if(name==='dash')loadDash();
  if(name==='prof')loadProf();
  if(name==='staff')loadStaff();
  if(name==='admin')loadAdmin();
}

function setPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  const el=document.getElementById(id);
  if(el)el.classList.add('on');
}

function setNavOn(name){
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const el=document.getElementById('nb-'+name);
  if(el)el.classList.add('on');
}

function setSbNav(name){
  document.querySelectorAll('.sbnav-btn').forEach(b=>b.classList.remove('on'));
  const el=document.getElementById('sn-'+name);
  if(el)el.classList.add('on');
}

function showHistMob(){
  loadHistMob();
  document.getElementById('histOv').classList.add('show');
}
function closeHistMob(){document.getElementById('histOv').classList.remove('show');}

// ── SPORT TABS ─────────────────────────────────────────────────────
function sTab(btn){
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  sport=btn.dataset.sport;
  gotoChat();
  loadHotGames();
}

// ── SESSIONS ───────────────────────────────────────────────────────
async function loadSessions(){
  try{
    const d=await api('/api/sessions');
    renderHist(d.sessions||[]);
  }catch(e){}
}

function renderHist(sessions){
  const targets=[document.getElementById('sbHist')];
  targets.forEach(list=>{
    if(!list)return;
    list.innerHTML=sessions.length?'':'<div style="color:var(--m);font-size:12px;padding:8px">No chats yet</div>';
    sessions.forEach(s=>{
      const d=document.createElement('div');
      d.className='hi'+(s.id===sessId?' on':'');
      d.dataset.id=s.id;
      d.innerHTML=`<span>${ICONS[s.sport_tab]||'🎯'}</span><span class="hi-title">${esc(s.title)}</span><button class="hi-x" onclick="delSess(event,'${s.id}')">✕</button>`;
      d.onclick=e=>{if(!e.target.classList.contains('hi-x')){loadSess(s.id);gotoChat();closeHistMob();}};
      list.appendChild(d);
    });
  });
}

function loadHistMob(){
  const list=document.getElementById('histMobList');
  if(!list)return;
  list.innerHTML='';
  const sbHist=document.getElementById('sbHist');
  if(sbHist) list.innerHTML=sbHist.innerHTML;
}

async function newChat(){
  try{
    const r=await api('/api/sessions/new','POST',{sport_tab:sport});
    sessId=r.session_id;clearMsgs();await loadSessions();
  }catch(e){sessId='default';clearMsgs();}
}

async function loadSess(sid){
  sessId=sid;
  document.querySelectorAll('.hi').forEach(el=>el.classList.toggle('on',el.dataset.id===sid));
  clearMsgs(false);
  try{
    const d=await api(`/api/sessions/${sid}`);
    if(!d.history?.length){showWelcome();return;}
    d.history.forEach(m=>{if(m.role==='user')addUserMsg(m.content);else addAiMsg(m.content,[]);});
    if(d.bets?.length)addBetsToLast(d.bets);
  }catch(e){showWelcome();}
}

async function delSess(e,sid){
  e.stopPropagation();
  // Note: we don't call DELETE endpoint — just remove from view per "don't delete data" requirement
  // Actually we keep it in DB but can hide: for now just reload
  try{await api(`/api/sessions/${sid}`,'DELETE');}catch(e){}
  if(sessId===sid)await newChat();else await loadSessions();
}

// ── HOT GAMES ──────────────────────────────────────────────────────
async function loadHotGames(){
  const el=document.getElementById('hotGames');
  if(!el)return;
  el.innerHTML='<span class="load-txt">Fetching upcoming games...</span>';
  try{
    const d=await api(`/api/hot-games?sport=${sport}`);
    const games=d.games||[];
    if(!games.length){el.innerHTML='<span class="load-txt">No upcoming games found</span>';return;}
    el.innerHTML=games.map(g=>`<div class="hg" onclick="sendQ('${esc(g.query)}')"><div class="hg-sp">${g.sport}</div><div class="hg-m">${esc(g.home)} vs ${esc(g.away)}</div><div class="hg-d">${g.date||'Upcoming'}</div></div>`).join('');
  }catch(e){if(el)el.innerHTML='<span class="load-txt">Could not load</span>';}
}

// ── SEND MESSAGE ───────────────────────────────────────────────────
function hKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function aResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function sendQ(t){document.getElementById('inp').value=t;aResize(document.getElementById('inp'));sendMsg();}

async function sendMsg(){
  if(loading)return;
  const input=document.getElementById('inp');
  const text=input.value.trim();
  if(!text)return;
  const w=document.getElementById('welcome');if(w)w.remove();
  addUserMsg(text);input.value='';input.style.height='auto';
  const tid=showTyping();
  loading=true;document.getElementById('sBtn').disabled=true;
  try{
    const d=await api('/api/chat','POST',{message:text,session_id:sessId,sport_tab:sport});
    removeTyping(tid);
    if(d.limit_reached){addLimitMsg();}
    else{
      addAiMsg(d.response,d.bets||[]);
      if(d.parlay?.picks?.length)addParlayToLast(d.parlay);
      dailyUsed++;updateUI();
      await loadSessions();
    }
  }catch(e){removeTyping(tid);addAiMsg(`⚠️ ${e.message}`,[]);}
  finally{loading=false;document.getElementById('sBtn').disabled=false;}
}

// ── RENDER MESSAGES ────────────────────────────────────────────────
function addUserMsg(text){
  const c=document.getElementById('msgs'),d=document.createElement('div');
  d.className='msg msg-u';
  d.innerHTML=`<div class="av av-u">YOU</div><div class="mb"><div class="mn">You</div><div class="bbl bbl-u">${esc(text).replace(/\n/g,'<br>')}</div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function addAiMsg(text,bets){
  const c=document.getElementById('msgs'),d=document.createElement('div');
  d.className='msg';
  const cm=text.match(/🎯\s*\*\*MY CONCLUSION[^*]*\*\*:?([\s\S]*?)(?=\n\n|\n---|$)/i);
  const ch=cm?`<div class="conc"><div class="conc-lbl">🎯 My Conclusion</div><div class="conc-txt">${fmt(cm[1].trim())}</div></div>`:'';
  const bh=bets.length?renderBets(bets):'';
  d.innerHTML=`<div class="av av-a">🎯</div><div class="mb"><div class="mn">OddsGPT</div><div class="bbl bbl-a">${fmt(text)}</div>${ch}${bh}</div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function addLimitMsg(){
  const c=document.getElementById('msgs'),d=document.createElement('div');
  d.className='msg';
  d.innerHTML=`<div class="av av-a">🎯</div><div class="mb"><div class="mn">OddsGPT</div>
    <div class="lcard"><div class="lcard-t">⛔ Daily Limit Reached</div>
    <div style="font-size:13px;color:var(--m2);margin-bottom:8px">You've used all 3 free analyses today. Enter a code to unlock Premium.</div>
    <div class="code-row"><input class="code-inp" id="inlineCode" placeholder="Enter promo code"/><button class="code-btn" onclick="applyInline()">Apply</button></div>
    <div id="inlineMsg" style="font-size:11px;margin-top:6px;display:none"></div></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

async function applyInline(){
  const code=document.getElementById('inlineCode')?.value?.trim();
  if(!code)return;
  const msg=document.getElementById('inlineMsg');
  try{
    const r=await api('/api/auth/apply-code','POST',{code});
    if(r.success){role='premium';save();updateUI();if(msg){msg.textContent=r.message;msg.style.color='var(--win)';msg.style.display='block';}}

function renderBets(bets){
  if(!bets.length)return'';
  const cards=bets.map(b=>`
    <div class="bc ${esc(b.risk)}" data-id="${b.id||''}">
      ${b.match?`<div class="bc-match">${esc(b.match)}</div>`:''}
      <div><div class="bc-type">${esc(b.type||b.bet_type||'')}</div><div class="bc-pick">${esc(b.pick)}</div><div class="bc-reason">${esc(b.reasoning||b.reason||'')}</div></div>
      <div class="bc-right"><div class="bc-odds">${esc(b.odds_range||b.odds||'N/A')}</div><div class="${esc(b.risk)} rb">${esc(b.risk)}</div></div>
      <div class="cbar"><div class="cfill" style="width:${b.confidence}%"></div></div>
      <div class="clbl">Confidence: ${b.confidence}%</div>
      ${b.id?`<div class="res-btns"><button class="rbtn wb" onclick="markRes(${b.id},'won',this)">✓ Won</button><button class="rbtn lb" onclick="markRes(${b.id},'lost',this)">✗ Lost</button></div>`:''}
    </div>`).join('');
  return `<div class="bets-wrap"><div class="bets-lbl">🎲 Recommendations</div>${cards}</div>`;
}

async function markRes(id,result,btn){

// ── API ────────────────────────────────────────────────────────────
async function api(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json',...(tok?{'Authorization':`Bearer ${tok}`}:{})}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  const d=await r.json();
  if(!r.ok)throw new Error(d.detail||`Error ${r.status}`);
  return d;
}

// ── HELPERS ────────────────────────────────────────────────────────
function V(id){return document.getElementById(id)?.value?.trim()||'';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(t){
  return esc(t)
    .replace(/^###\s+(.+)$/gm,'<h3 style="font-family:Syne,sans-serif;color:var(--a);margin:12px 0 4px;font-size:14px">$1</h3>')
    .replace(/^##\s+(.+)$/gm,'<h3 style="font-family:Syne,sans-serif;color:var(--a);margin:12px 0 4px;font-size:14px">$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr style="border-color:var(--b);margin:10px 0">')
    .replace(/^[-•]\s+(.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n/g,'<br>');
}
